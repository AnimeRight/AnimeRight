<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="PASTE-YOUR-GOOGLE-VERIFICATION-CODE-HERE">
<meta name="description" content="Anime Right: watch anime online.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0314; --panel:#160826; --line:#4b1d82; --text:#f5ecff; --muted:#b9a2d9;
  --purple:#8b2cff; --magenta:#ff2bd6; --cyan:#00e5ff; --gold:#ffe14d;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:17px;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 500px at 15% 10%,rgba(139,44,255,.55),transparent 60%),
  radial-gradient(800px 600px at 90% 30%,rgba(255,43,214,.28),transparent 60%),
  radial-gradient(900px 700px at 50% 110%,rgba(0,229,255,.18),transparent 60%),
  linear-gradient(160deg,#12041f,#0a0314 60%,#1a0633)}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.2}
#bg svg{width:100%;height:100%}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit}

/* Banner + nav */
.banner{display:flex;align-items:center;justify-content:center;gap:18px;padding:26px 16px 18px;border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(139,44,255,.25),transparent)}
.banner svg.logo{width:84px;height:84px;filter:drop-shadow(0 0 12px var(--magenta))}
.brand{font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:clamp(34px,7vw,68px);line-height:1;letter-spacing:2px;margin:0;
  background:linear-gradient(90deg,#fff 0%,var(--cyan) 30%,var(--magenta) 70%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #3a0a7a)}
.tag{margin:6px 0 0;color:var(--muted);letter-spacing:4px;text-transform:uppercase;font-size:13px;font-weight:700}
nav{position:relative;z-index:50;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:rgba(22,8,38,.96);border-bottom:1px solid var(--line)}
.left,.right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;border:0;cursor:pointer;padding:9px 18px;border-radius:6px;text-decoration:none;display:inline-block;
  background:linear-gradient(135deg,var(--purple),var(--magenta));box-shadow:0 0 12px rgba(255,43,214,.4);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;border:2px solid var(--cyan);color:var(--cyan);box-shadow:none}
.btn.sm{padding:5px 11px;font-size:13px}
.badge{background:var(--gold);color:#2a0a4a;border-radius:99px;padding:0 7px;margin-inline-start:4px;font-size:12px}
.date{color:var(--gold);font-weight:700;letter-spacing:1px;border:1px dashed rgba(255,225,77,.6);padding:7px 12px;border-radius:6px;font-size:15px}
.menu{position:relative}
.menu ul{display:none;position:absolute;inset-inline-end:0;top:100%;z-index:60;margin:0;padding:6px;list-style:none;min-width:200px;background:var(--panel);border:2px solid var(--purple);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.menu ul::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.menu.open ul,.menu:hover ul{display:block}
.menu li a{display:block;padding:9px 12px;color:var(--text);text-decoration:none;border-radius:5px}
.menu li a:hover{background:var(--purple)}
.search{display:flex;border:2px solid var(--purple);border-radius:8px;overflow:hidden;background:#0d0418}
.search input{color:var(--text);background:transparent;border:0;outline:0;padding:9px 12px;width:min(220px,44vw)}
.search input::placeholder{color:var(--muted)}
.search button{border:0;cursor:pointer;padding:0 14px;background:var(--cyan);color:#10002a;font-size:18px}

/* Home */
.hero{position:relative;overflow:hidden;width:calc(100% - 40px);max-width:1240px;margin:24px auto 0;padding:46px 32px;border:2px solid var(--purple);border-radius:14px;background:linear-gradient(110deg,rgba(18,4,31,.95) 40%,rgba(139,44,255,.5)),radial-gradient(500px 300px at 90% 20%,rgba(255,43,214,.5),transparent);box-shadow:0 0 24px rgba(139,44,255,.4)}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:240px;height:180%;background:linear-gradient(var(--magenta),var(--cyan));transform:rotate(20deg);opacity:.22;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .k{display:inline-block;background:var(--gold);color:#2a0a4a;font-weight:700;letter-spacing:2px;font-size:13px;padding:3px 10px;border-radius:4px}
.hero h2{font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:clamp(26px,5vw,46px);margin:12px 0 8px;text-shadow:0 0 14px var(--magenta)}
.hero p{max-width:520px;color:var(--muted);margin:0 0 18px;font-size:18px}
.hero .btn+.btn{margin-inline-start:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;width:calc(100% - 40px);max-width:1240px;margin:18px auto 0}
.chip{color:var(--text);background:rgba(139,44,255,.25);border:1px solid var(--purple);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700}
.chip:hover,.chip.on{background:var(--magenta)}
main{max-width:1280px;margin:0 auto;padding:26px 20px 50px}
.row{margin-bottom:30px;content-visibility:auto;contain-intrinsic-size:auto 340px}
.row h2{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:22px;letter-spacing:1px}
.row h2::before{content:"";width:8px;height:26px;background:linear-gradient(var(--cyan),var(--magenta));border-radius:2px}
.row h2 span{margin-inline-start:auto;font-family:"Rajdhani",sans-serif;font-size:14px;color:var(--cyan);font-weight:700}
.track{display:flex;gap:16px;overflow-x:auto;padding:12px 8px 16px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{height:8px}.track::-webkit-scrollbar-thumb{background:var(--purple);border-radius:4px}
.card{flex:0 0 170px;scroll-snap-align:start;text-decoration:none;color:var(--text)}
.poster{aspect-ratio:2/3;border-radius:10px;position:relative;overflow:hidden;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s}
.poster b{font-family:"Bungee",sans-serif;font-weight:400;font-size:54px;color:rgba(255,255,255,.28)}
.poster i{position:absolute;top:8px;inset-inline-start:8px;font-style:normal;font-size:12px;font-weight:700;background:var(--gold);color:#2a0a4a;padding:2px 7px;border-radius:3px}
.poster u{position:absolute;top:8px;inset-inline-end:8px;text-decoration:none;font-size:11px;font-weight:700;background:var(--cyan);color:#10002a;padding:2px 6px;border-radius:3px}
.poster em{position:absolute;inset:auto 0 0 0;padding:26px 0 8px;text-align:center;font-style:normal;font-size:26px;background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .15s}
.card:hover .poster{transform:translateY(-5px);border-color:var(--cyan)}
.card:hover .poster em{opacity:1}
.card p{margin:8px 2px 0;font-weight:700;font-size:16px;line-height:1.2}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0;font-size:20px}

/* Pages (shop / watch / admin) */
.page{width:calc(100% - 40px);max-width:1000px;margin:24px auto 50px}
.page h2{font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:clamp(22px,4vw,34px);margin:6px 0 16px}
.link{background:none;border:0;color:var(--cyan);cursor:pointer;padding:4px 6px;font-weight:700}
.link:disabled{color:var(--muted);cursor:default}
.plans{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding-top:14px}
.plan{--c:#ffb02e;position:relative;width:min(300px,100%);border-radius:16px;padding:16px 16px 18px;text-align:center;border:1px solid rgba(255,255,255,.14)}
.plan.vip{background:linear-gradient(180deg,#120620 30%,#5a2a05)}
.plan.ar{--c:#00e5ff;background:linear-gradient(180deg,#120620 30%,#4a0f5c)}
.plan h3{margin:0 0 12px;font-family:"Bungee","Impact",sans-serif;font-weight:400;font-size:20px}
.pbox{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:20px 14px}
.art{width:120px;height:120px;filter:drop-shadow(0 0 12px var(--c))}
.pdur{font-family:"Bungee",sans-serif;font-size:30px;color:var(--c);margin:8px 0 4px;text-shadow:0 0 10px var(--c)}
.pbox ul{list-style:none;margin:8px 0;padding:0;color:var(--muted);font-size:15px}
.pbox li::before{content:"✓ ";color:var(--cyan)}
.pprice{color:#7fb8ff;font-weight:700;font-size:22px;margin-top:8px}
.pact{color:var(--gold);font-weight:700;margin-top:6px}
.pay{margin-top:14px;width:100%;font-weight:700;font-size:18px;color:#cfd8ff;background:rgba(80,100,200,.25);border:1px solid rgba(140,160,255,.5);border-radius:10px;padding:12px;cursor:pointer}
.pay:hover{background:rgba(80,100,200,.5)}
.best{position:absolute;top:-10px;inset-inline-end:14px;background:var(--gold);color:#2a0a4a;font-weight:700;font-size:12px;padding:3px 10px;border-radius:4px}
.player{aspect-ratio:16/9;background:#000;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.player video{width:100%;height:100%}
.wbar{margin:14px 0}
.page textarea,.page input[type=text],.page input[type=url],.page select{width:100%;color:var(--text);background:#0d0418;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;outline:0}
.page input[type=file]{margin-bottom:10px;color:var(--muted)}
.page textarea{min-height:80px;resize:vertical}
.cm{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(22,8,38,.7)}
.cm small{color:var(--muted);margin-inline-start:8px}
.cm p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.pend{color:var(--gold);font-style:normal;font-size:13px}
.atabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.arow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(22,8,38,.7)}
.grow{flex:1;min-width:140px;overflow-wrap:anywhere}
.tag2{font-size:12px;border:1px solid var(--purple);border-radius:4px;padding:1px 7px}
.tag2.pending{border-color:var(--gold);color:var(--gold)}

footer{text-align:center;color:var(--muted);font-size:14px;padding:18px;border-top:1px solid var(--line)}
#prev{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline-start:10px;z-index:90;background:var(--gold);color:#2a0a4a;font-weight:700;font-size:12px;padding:4px 10px;border-radius:6px}
#toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;z-index:120;background:#1d0a33;border:2px solid var(--cyan);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* Overlays */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(5,1,12,.88)}
.dlg{position:relative;width:min(400px,100%);background:var(--panel);border:2px solid var(--purple);border-radius:14px;padding:26px 22px 22px;box-shadow:0 0 30px rgba(139,44,255,.5)}
.x{position:absolute;top:8px;inset-inline-end:10px;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;font-weight:700;padding:9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff;border-color:transparent}
.dlg input{display:block;width:100%;color:var(--text);background:#0d0418;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;outline:0}
.dlg input:focus{border-color:var(--cyan)}
.err{min-height:20px;margin:0 0 10px;color:#ff7a9c;font-size:15px}
.dlg .btn{width:100%}
.vinfo{margin:0 0 10px;color:var(--muted)}
#fc{text-align:center;letter-spacing:8px;font-size:22px}
.vlinks{display:flex;justify-content:space-between;margin-top:8px}
.ov.full{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;background:#0b0618}
.lhead{display:flex;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1px solid var(--line)}
.lhead h2{margin:0;font-size:26px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font-size:20px;cursor:pointer}
[dir=rtl] .back{transform:scaleX(-1)}
.lgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));align-content:start}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;text-align:start}
.tile:hover{border-color:var(--cyan)}
.tile.on{border-color:#3b9cff;background:rgba(59,156,255,.14)}
.tile b{display:block;letter-spacing:1px;text-transform:uppercase}
.tile small{color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:1px}
.fl{flex:0 0 30px;height:21px;border-radius:2px;border:1px solid rgba(255,255,255,.25)}
.ck{margin-inline-start:auto;width:22px;height:22px;border-radius:50%;background:#3b9cff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
@media(max-width:700px){nav{justify-content:center}.card{flex-basis:140px}}

.phead{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.pid{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avwrap{position:relative;width:150px;height:150px}
.ring{width:100%;height:100%;border-radius:50%;padding:5px;background:#2a2a35}
.av{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.av img,.av video{width:100%;height:100%;object-fit:cover}
.av svg{width:62%;height:62%}
.avedit{position:absolute;bottom:4px;inset-inline-end:4px;width:34px;height:34px;border-radius:50%;border:0;background:var(--gold);color:#222;cursor:pointer;font-size:16px}
.pname{margin:0!important;font-size:28px!important}
.phand{color:var(--muted);font-size:15px}
.chipx{display:inline-block;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700;margin-inline-end:6px;border:1px solid currentColor}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:rgba(22,8,38,.7);overflow:hidden}
.stats div{padding:14px 22px;text-align:center;border-inline-end:1px solid var(--line)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:22px}
.stats small{color:var(--muted)}
.pbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.pbtn{padding:14px;border-radius:10px;border:0;background:#2a1a3d;color:var(--text);cursor:pointer;font-weight:700}
.pbtn:hover{background:#3b2457}
.ptabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.ptab{flex:1;min-width:110px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:14px 8px;cursor:pointer;font-weight:700}
.ptab.on{color:var(--gold);border-color:var(--gold)}
.dashed{border:1px dashed var(--line);border-radius:12px;padding:46px 16px;text-align:center;color:var(--muted);font-size:18px;margin-bottom:12px}
.pgrid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px}
.ebox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:rgba(22,8,38,.7)}
.ach{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.ach span{padding:8px 12px;border-radius:8px;border:1px solid var(--line);opacity:.4}
.ach span.on{opacity:1;border-color:var(--gold);color:var(--gold)}
.ulink{padding:0!important;font-size:inherit;color:var(--cyan)}
.tk{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(22,8,38,.7)}
.cd{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
#aiBtn{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;width:56px;height:56px;border-radius:50%;border:0;font-size:26px;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--magenta));box-shadow:0 0 16px rgba(255,43,214,.6)}
#aiBub{position:fixed;inset-inline-end:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;max-width:250px;background:#1d0a33;border:2px solid var(--magenta);border-radius:14px;padding:12px 30px 12px 14px;cursor:pointer}
#aiBub .x{top:2px;inset-inline-end:6px}
#aiBub i{display:block;height:3px;margin-top:8px;background:var(--cyan);animation:cdn 60s linear forwards}
@keyframes cdn{from{width:100%}to{width:0}}
#aiPanel{position:fixed;inset-inline-end:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:85;width:min(360px,calc(100vw - 32px));height:min(480px,65vh);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--purple);border-radius:14px;overflow:hidden}
.lhead2{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.x2{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px}
#aiMsgs{flex:1;overflow:auto;padding:12px}
.msg{margin-bottom:10px;padding:8px 12px;border-radius:10px;max-width:92%;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{background:rgba(139,44,255,.4);margin-inline-start:auto}
.msg.bot{background:rgba(255,255,255,.07)}
.aform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.aform input{flex:1;min-width:0;color:var(--text);background:#0d0418;border:2px solid var(--line);border-radius:8px;padding:8px 10px;outline:0}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.tx{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(22,8,38,.7)}
.st-success{color:#5dff9a;font-weight:700}.st-failed{color:#ff7a9c;font-weight:700}.st-pending{color:var(--gold);font-weight:700}
</style>
</head>
<body>

<div id="bg" aria-hidden="true">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="#d9a3ff">
  <defs>
    <g id="ch">
      <path d="M55 85 L35 25 L72 55 L82 5 L102 50 L125 0 L132 55 L165 22 L148 88 Q152 140 102 155 Q52 140 55 85Z"/>
      <path d="M10 260 Q18 175 102 158 Q186 175 194 260Z"/>
      <path d="M68 100 L92 108 L86 114Z M136 100 L112 108 L118 114Z" fill="#12041f"/>
    </g>
    <g id="eye">
      <ellipse cx="0" cy="0" rx="150" ry="70" fill="none" stroke="#d9a3ff" stroke-width="6"/>
      <circle cx="0" cy="0" r="56"/><circle cx="-18" cy="-20" r="16" fill="#12041f"/><circle cx="20" cy="18" r="8" fill="#12041f"/>
    </g>
  </defs>
  <circle cx="800" cy="330" r="260" fill="none" stroke="#d9a3ff" stroke-width="4"/>
  <circle cx="800" cy="330" r="200" opacity=".35"/>
  <g stroke="#d9a3ff" stroke-width="3" opacity=".6"><path d="M0 120 L520 300M0 220 L480 330M0 700 L520 560M1600 100 L1080 290M1600 240 L1100 340M1600 720 L1080 560"/></g>
  <use href="#ch" transform="translate(70 360) scale(2.2)"/>

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h;}
}

}

/* The code is emailed to the user's Gmail. It is never shown on screen. */
async function sendCode(){
  pend.tries=0; pend.exp=Date.now()+6e5;
  if(CFG.sendUrl){
    try{const r=await fetch(CFG.sendUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pend.mail})});return r.ok;}catch(e){return false;}
  }
  const E=CFG.emailjs; if(!(E.service&&E.template&&E.publicKey))return false;
  const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%1e6).padStart(6,'0');
  pend.chash=await sha(pend.salt+code);
  try{
    const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({service_id:E.service,template_id:E.template,user_id:E.publicKey,template_params:{to_email:pend.mail,code:code,site:'Anime Right'}})});
    return r.ok;
  }catch(e){return false;}
}
$('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('fu').value.trim(), p=$('fp').value, key=name.toLowerCase(), db=users(), err=$('ferr');
  if(mode==='up'){
    const mail=$('fm').value.trim().toLowerCase(), nm=normMail(mail);
    if(name.length<3||name.includes('@')||p.length<6||p!==$('fp2').value){err.textContent=t(19);return;}
    if(!GM.test(mail)){err.textContent=t(25);return;}
    if(db[key]||(key==='sina'&&!CFG.preview&&nm!==normMail(CFG.ownerGmail))){err.textContent=t(20);return;}
    if(Object.values(db).some(u=>u.mail===nm)){err.textContent=t(26);return;}
    const salt=Math.random().toString(36).slice(2), hash=await sha(salt+p);
    if(CFG.preview){createUser(name,mail,nm,salt,hash);return;}
    pend={name,mail,nm,salt,hash};
    if(!(await sendCode())){err.textContent='The verification email could not be sent. The email service is not connected yet.';pend=null;return;}
    showVerify();
  }else{
    const r=db[key]||Object.values(db).find(u=>u.mail&&u.mail===normMail(key));
    if(!r||!r.hash||await sha(r.salt+p)!==r.hash){err.textContent=t(21);return;}
    finish(r.name);
  }
});
$('vForm').addEventListener('submit',async e=>{
  e.preventDefault(); const c=$('fc').value.trim(), err=$('verr');
  if(!pend||Date.now()>pend.exp||pend.tries>=5){err.textContent=t(31);return;}
  pend.tries++; let ok=false;
  if(CFG.verifyUrl){
    try{const r=await fetch(CFG.verifyUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pend.mail,code:c})});ok=r.ok&&(await r.json()).ok===true;}catch(x){}
  }else ok=!!pend.chash&&(await sha(pend.salt+c))===pend.chash;
  if(!ok){err.textContent=t(31);return;}
  createUser(pend.name,pend.mail,pend.nm,pend.salt,pend.hash);
});

const fmtCd=ms=>{
  const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),p=n=>String(n).padStart(2,'0');
  let ds=''; if(d){try{ds=new Intl.NumberFormat(LOC[lang]||lang,{style:'unit',unit:'day',unitDisplay:'narrow'}).format(d)+' ';}catch(e){ds=d+'d ';}}
  return ds+p(h)+':'+p(m)+':'+p(s%60);
};
function tick(){
  const now=Date.now(); let ex=false;
  document.querySelectorAll('.cd[data-exp]').forEach(e=>{const ms=+e.dataset.exp-now;if(ms<=0)ex=true;e.textContent=fmtCd(ms);});
  if(ex)sweep();
}
function sweep(){
  const db=users(), now=Date.now(), mine=(me()||'').toLowerCase(); let ch=false, own=false;
  for(const k in db){const r=db[k];if(r.sub&&r.sub.exp<=now){r.sub=null;ch=true;if(k===mine)own=true;}}
  if(ch){W('ar_users',db);if(own)toast(t(63));refreshAuth();}
}

/* ---------- Profile picture / video + AI safety scan ---------- */
const dataBlob=d=>{const [h,b]=d.split(','),m=/:(.*?);/.exec(h)[1],bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m});};
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
let nsfwModel=null;
/* Returns 'clean' | 'explicit' | 'unavailable'. Never returns 'clean' unless a scanner actually ran. */
async function scan(frames){
  try{
    if(CFG.moderationUrl){const r=await fetch(CFG.moderationUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frames})});if(r.ok){const j=await r.json();return j.explicit?'explicit':'clean';}}
  }catch(e){}
  try{
    const S=window.claude&&claude.use?await claude.use('sample'):null;
    if(S&&(await S.limits()).images){
      const j=await S.json('You are a strict content-safety filter for an anime streaming site. The attached images are frames of one profile picture or video. Reply ONLY with JSON {"explicit":true} or {"explicit":false}. explicit=true if ANY frame shows nudity, sexual acts or pornographic/hentai content. Ordinary anime art, swimsuits and fan-service without nudity are explicit=false.',{images:frames.map(dataBlob),modelTier:'quick',cache:false});
      if(typeof j.explicit==='boolean')return j.explicit?'explicit':'clean';
    }
  }catch(e){}
  try{
    const N=CFG.nsfw;
    if(N&&N.lib){
      if(!nsfwModel){await loadScript(N.tf);await loadScript(N.lib);nsfwModel=await nsfwjs.load(N.model||undefined);}
      for(const f of frames){
        const im=new Image(); im.src=f; await im.decode();
        const p=await nsfwModel.classify(im), g=n=>(p.find(x=>x.className===n)||{}).probability||0;
        if(g('Porn')+g('Hentai')>=.5||g('Sexy')>=.7)return 'explicit';
      }
      return 'clean';
    }
  }catch(e){}
  return 'unavailable';
}
function vidFrames(file){
  return new Promise(res=>{
    const v=document.createElement('video'), url=URL.createObjectURL(file), out=[];
    v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
    const done=x=>{URL.revokeObjectURL(url);res(x);};
    v.onerror=()=>done(null);
    v.onloadedmetadata=async()=>{
      const d=v.duration; if(!isFinite(d)||d>15.5)return done(null);
      const c=document.createElement('canvas'); c.width=224; c.height=224; const g=c.getContext('2d');
      try{for(const f of [.1,.35,.6,.9]){v.currentTime=Math.min(d*f,d-.05);await new Promise(r=>v.onseeked=r);g.drawImage(v,0,0,224,224);out.push(c.toDataURL('image/jpeg',.8));}}catch(e){return done(null);}
      done(out);
    };
  });
}
async function setAvatarImage(f){
  const u=need(); if(!u||!f.type.startsWith('image/'))return;
  let d; try{d=await resizeImg(f,256);}catch(e){return;}
  toast(t(94)); const res=await scan([d]);
  if(res==='explicit'){toast(t(70));return;}
  if(res==='clean'){u.avatar=d;saveUser(u);toast(t(71));}
  else{
    const L=media().filter(m=>!(m.user===u.name&&m.type==='image')); L.unshift({id:uid(),user:u.name,type:'image',data:d,status:'pending',ai:res,ts:Date.now()});
    W('ar_media',L); notifyOwner({type:'media_pending',user:u.name,kind:'image'}); toast(t(72));
  }
  renderProfile(); refreshAuth();
}
async function setAvatarVideo(f){
  const u=need(); if(!u||!canVid(u))return;
  if(!f.type.startsWith('video/')||f.size>20*1048576){toast(t(73));return;}
  toast(t(94)); const fr=await vidFrames(f); if(!fr){toast(t(73));return;}
  const res=await scan(fr); if(res==='explicit'){toast(t(70));return;}
  const id=uid(); try{await idb('put','m'+id,f);}catch(e){toast(t(73));return;}
  if(u.avVideo){try{await idb('del','m'+u.avVideo.id);}catch(e){}}
  u.avVideo={id,status:'pending'}; saveUser(u);
  const L=media().filter(m=>!(m.user===u.name&&m.type==='video')); L.unshift({id,user:u.name,type:'video',status:'pending',ai:res,ts:Date.now()});
  W('ar_media',L); notifyOwner({type:'media_pending',user:u.name,kind:'video'}); toast(t(69)); renderProfile(); refreshAdminBadge();
}
async function reviewMedia(id,ok){
  const L=media(), m=L.find(x=>x.id===id); if(!m)return; m.status=ok?'ok':'rejected'; W('ar_media',L);
  const db=users(), r=db[m.user.toLowerCase()]; if(!r)return;

}

let rvU=[];
async function loadRv(){
  rvU.forEach(u=>URL.revokeObjectURL(u)); rvU=[];
  for(const v of document.querySelectorAll('#abody .rvv')){try{const b=await idb('get','m'+v.dataset.v);if(b){const u=URL.createObjectURL(b);rvU.push(u);v.src=u;}}catch(e){}}
}
function renderAdmin(){
  const box=$('vAdmin'); if(!isOwner(cur())){box.textContent='';return;}
  if(!$('atabs'))box.innerHTML='<h2>🛡 Owner panel</h2><div class="atabs" id="atabs"></div><div id="abody"></div>';
  $('atabs').innerHTML=ATABS.map(([k,l])=>{const n=cnt[k]?cnt[k]():0;return '<button class="chip'+(k===atab?' on':'')+'" data-k="'+k+'">'+l+(n?' ('+n+')':'')+'</button>';}).join('');
  $('abody').innerHTML=ADM[atab](); if(atab==='rv')loadRv(); tick();
}
async function adminUpload(){
  const msg=$('aMsg'), name=$('aName').value.trim(), im=$('aImg').files[0], vf=$('aFile').files[0], url=$('aUrl').value.trim();
  if(!name||(!im&&!vf&&!url)){msg.textContent='Add a title and at least a cover image or a video.';return;}
  msg.textContent='Saving…'; const id='v'+uid(), it={id,name,ep:$('aEp').value.trim()||'EP 1',row:+$('aRow').value,vt:'url',src:url};
  try{
    if(im)it.img=await resizeImg(im,400,600);
    if(vf){
      if(CFG.uploadUrl){const fd=new FormData();fd.append('file',vf);const r=await fetch(CFG.uploadUrl,{method:'POST',body:fd});it.src=(await r.json()).url;it.vt='url';}
      else{await idb('put',id,vf);it.vt='file';it.src='';}
    }
  }catch(x){msg.textContent='Upload failed ('+((x&&x.name)||'error')+'). The file may be too large for this browser’s storage.';return;}
  const c=cat().slice(); c.unshift(it);
  if(!setCat(c)){msg.textContent='Could not save: browser storage is full.';return;}
  render(); $('aForm').reset();
  msg.textContent=(it.vt==='file'?'✓ Saved in this browser only. Set uploadUrl in CFG to store files on your server.':'✓ Saved.');
}
$('vAdmin').addEventListener('click',async e=>{
  if(!isOwner(cur()))return; const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
  if(d.k){atab=d.k;renderAdmin();return;}
  if(d.ok||d.del){let L=cms();if(d.ok){const c=L.find(x=>x.id===d.ok);if(c)c.s='ok';}else L=L.filter(x=>x.id!==d.del);W('ar_cm',L);}
  else if(d.rp){const L=tks(),x=L.find(y=>y.id===d.rp),tx=document.querySelector('textarea[data-r="'+d.rp+'"]');if(x&&tx&&tx.value.trim()){x.reply=tx.value.trim();W('ar_tk',L);}}
  else if(d.tc){const L=tks(),x=L.find(y=>y.id===d.tc);if(x){x.st=x.st==='open'?'closed':'open';W('ar_tk',L);}}
  else if(d.mok||d.mrj){await reviewMedia(d.mok||d.mrj,!!d.mok);}
  else if(d.txok||d.txno){const L=txs(),x=L.find(y=>y.id===(d.txok||d.txno));if(x&&x.st==='pending'){x.st=d.txok?'success':'failed';x.why='';W('ar_tx',L);if(d.txok)grant(x.u,x.plan,0);}}
  else if(d.rv){const db=users(),r=db[d.rv.toLowerCase()];if(r){r.sub=null;W('ar_users',db);}}
  else if(d.dt){W('ar_plans',J('ar_plans',[]).filter(p=>p.id!==d.dt));}
  else if(d.d){try{await idb('del',d.d);}catch(x){}setCat(cat().filter(a=>a.id!==d.d));render();}
  else return;
  renderAdmin(); refreshAuth();
});
$('vAdmin').addEventListener('submit',async e=>{
  e.preventDefault(); if(!isOwner(cur()))return; const f=e.target.id;
  if(f==='aForm')await adminUpload();
  else if(f==='gForm'){
    const r=users()[$('gUser').value.trim().toLowerCase()], p=plans().find(x=>x.id===$('gPlan').value), days=parseInt($('gDays').value,10);
    if(!r){toast('No user with that username.');return;}
    grant(r.name,p.id,days>0?days:0); logTx(r,p,'success','owner'); toast('✓ '+p.name+' → '+r.name); renderAdmin(); refreshAuth();
  }else if(f==='tForm'){
    const name=$('tName').value.trim(), days=parseInt($('tDays').value,10), ai=parseInt($('tAi').value,10), col=$('tCol').value;
    if(!name||!(days>0)){toast('Give the tier a name and a duration in days.');return;}
    const P=J('ar_plans',[]); P.push({id:'c'+uid(),name:name.slice(0,24),price:$('tPrice').value.trim()||'—',days,dur:0,dl:$('tDl').checked,ic:$('tIc').checked,vid:$('tVid').checked,ai:ai>=0?ai:CFG.aiFree,color:/^#[0-9a-f]{6}$/i.test(col)?col:'#ffb02e',payUrl:''});
    W('ar_plans',P); toast('✓ Tier created'); renderAdmin();
  }
});

/* ---------- AI anime finder ---------- */
const pk=()=>{const d=new Date().toISOString();return CFG.aiPeriod==='month'?d.slice(0,7):CFG.aiPeriod==='total'?'all':d.slice(0,10);};
const aiQuota=u=>isOwner(u)?999:(planOf(u)?planOf(u).ai:CFG.aiFree);
const aiLeft=u=>Math.max(0,aiQuota(u)-((u.ai&&u.ai.p===pk())?u.ai.n:0));
function aiUse(u){const k=pk();u.ai=(u.ai&&u.ai.p===k)?u.ai:{p:k,n:0};u.ai.n++;saveUser(u);}
function aiRefresh(){
  $('aiBtn').title=t(87); $('aiBubT').textContent=t(88); $('aiT').textContent='🤖 '+t(87); $('aiIn').placeholder=t(89); $('aiSend').textContent=t(80);
  const u=cur(); $('aiLeft').textContent=u?t(90).replace('{n}',aiLeft(u)):'';
}
function addMsg(who,text){const m=document.createElement('div');m.className='msg '+who;m.textContent=text;$('aiMsgs').appendChild(m);$('aiMsgs').scrollTop=1e6;return m;}
function addPicks(m,titles){
  const hit=[...new Set((titles||[]).map(x=>String(x).toLowerCase()))].map(x=>items().find(a=>a.name.toLowerCase()===x)).filter(Boolean).slice(0,3);
  if(hit.length){const d=document.createElement('div');d.style.marginTop='8px';d.innerHTML=hit.map(a=>'<button class="chip aipick" data-id="'+esc(a.id)+'">▶ '+esc(a.name)+'</button> ').join('');m.appendChild(d);}
}
function localMatch(text){const w=text.toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(x=>x.length>2);return items().filter(a=>w.some(x=>a.name.toLowerCase().includes(x))).slice(0,3);}
async function askAI(text){
  const u=need(); if(!u)return;
  if(aiLeft(u)<=0){addMsg('bot',t(91));return;}
  addMsg('me',text); const m=addMsg('bot',t(93)); let reply='', picks=[], ok=false;
  try{
    const titles=items().map(a=>a.name);
    if(CFG.aiUrl){
      const r=await fetch(CFG.aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,lang,user:u.name,catalog:titles})});
      const j=await r.json(); reply=j.reply||''; picks=j.picks||[]; ok=!!reply;
    }else{
      const S=window.claude&&claude.use?await claude.use('sample'):null;
      if(S){
        const j=await S.json('You are the anime finder of the streaming website "Anime Right". A visitor wrote this (it may be in any language): "'+text.replace(/"/g,"'")+'"\nRecommend up to 3 anime that fit their taste, each with one short reason. Answer in the language with code "'+lang+'". The website currently hosts these titles: '+JSON.stringify(titles.slice(0,60))+'. Put any recommended title that exactly matches a hosted title in "picks". Reply ONLY with JSON: {"reply":"...","picks":["..."]}',{modelTier:'quick',cache:false});
        reply=String(j.reply||''); picks=j.picks||[]; ok=!!reply;
      }
    }
  }catch(e){}
  if(ok){aiUse(u);m.textContent=reply;addPicks(m,picks);}
  else{const hits=localMatch(text);m.textContent=t(95)+(hits.length?'':' '+t(96));addPicks(m,hits.map(a=>a.name));}
  aiRefresh();
}
$('aiBtn').onclick=()=>{const o=$('aiPanel').hidden;$('aiPanel').hidden=!o;$('aiBub').hidden=true;if(o)$('aiIn').focus();};
$('aiX').onclick=()=>{$('aiPanel').hidden=true;};

$('aiBub').onclick=()=>{$('aiBub').hidden=true;$('aiPanel').hidden=false;$('aiIn').focus();};
$('aiForm').addEventListener('submit',e=>{e.preventDefault();const v=$('aiIn').value.trim();if(v){$('aiIn').value='';askAI(v);}});
$('aiMsgs').addEventListener('click',e=>{const b=e.target.closest('.aipick');if(b){$('aiPanel').hidden=true;openAnime(b.dataset.id);}});
setTimeout(()=>{if($('aiPanel').hidden)$('aiBub').hidden=false;},1500);   /* pop-up bubble ... */
setTimeout(()=>{$('aiBub').hidden=true;},61500);                          /* ... stays for one minute */

$('prev').hidden=!CFG.preview;
ensureOwner();
setLang(detect(),false);
